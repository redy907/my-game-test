<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sombra do Vazio - Boss Fight</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div class="stat-container">
                <label>JOGADOR</label>
                <div class="bar-border"><div id="player-hp-bar"></div></div>
                <div class="bar-border stamina"><div id="player-stamina-bar"></div></div>
            </div>
            
            <div class="stat-container boss">
                <label id="boss-name">O ANIQUILADOR <span id="boss-phase-text">(FASE 1)</span></label>
                <div class="bar-border boss"><div id="boss-hp-bar"></div></div>
            </div>
        </div>

        <div id="screen">
            <div id="player" class="entity"></div>
            <div id="boss" class="entity"></div>
            <div id="enrage-timer" class="hidden">60</div>
        </div>

        <div id="controls-panel">
            <p><strong>[A / D]</strong> Mover | <strong>[Espaço]</strong> Pular | <strong>[Shift]</strong> Dash | <strong>[J]</strong> Atacar</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
